<script>
// Simple particle background — lightweight and subtle
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let w, h, particles = [];
function resize(){w = canvas.width = innerWidth; h = canvas.height = innerHeight}
window.addEventListener('resize', resize, {passive:true}); resize();


function rand(min,max){return Math.random()*(max-min)+min}
function makeParticles(n){particles = []; for(let i=0;i<n;i++){particles.push({x:rand(0,w), y:rand(0,h), r:rand(0.6,2.4), vx:rand(-0.2,0.2), vy:rand(-0.05,0.05), hue:rand(240,320)})}}
makeParticles(Math.round((w*h)/80000));


function step(){ctx.clearRect(0,0,w,h);
for(const p of particles){p.x += p.vx; p.y += p.vy; if(p.x< -10) p.x = w+10; if(p.x> w+10) p.x=-10; if(p.y< -10) p.y = h+10; if(p.y> h+10) p.y=-10;
ctx.beginPath(); ctx.fillStyle = `hsla(${p.hue},80%,65%,${0.08})`; ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
}
requestAnimationFrame(step);
}
step();


// tiny UI flourish: copy deploy snippet
document.addEventListener('click', e=>{const t = e.target; if(t.dataset.copy){const code = document.querySelector('.code-block code').innerText; navigator.clipboard?.writeText(code).then(()=>{t.innerText='Copied'; setTimeout(()=>t.innerText='Copy',1200)})}})
</script>
